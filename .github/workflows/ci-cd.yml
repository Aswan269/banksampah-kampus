name: CI-CD BankSampah Kampus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- CI: test tiap service ----------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, setoran, reward, laporan]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: SKIP_DB_INIT=1 python -m pytest -v

  # ---------- CI: build image & push ke GitHub Container Registry ----------
  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth, setoran, reward, laporan, frontend, nginx]
    steps:
      - uses: actions/checkout@v4
      - name: Nama owner huruf kecil
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tentukan nama image
        run: |
          NAME=${{ matrix.service }}
          [ "$NAME" = "nginx" ] && NAME=gateway
          echo "IMAGE=ghcr.io/$OWNER/$NAME" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # ---------- CD: deploy otomatis ke laptop (self-hosted runner Windows) ----------
  deploy:
    needs: build-push
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: deploy-laptop
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Pull image terbaru & jalankan ulang
        run: |
          $ErrorActionPreference = 'Continue'
          $env:REGISTRY = "ghcr.io/$($env:GITHUB_REPOSITORY_OWNER.ToLower())"
          Write-Host "REGISTRY = $env:REGISTRY"

          docker compose -p banksampah pull
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::docker compose pull gagal"; exit $LASTEXITCODE }

          docker compose -p banksampah up -d --no-build
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::docker compose up gagal"; exit $LASTEXITCODE }

          docker image prune -f
          exit 0

      - name: Cek kesehatan lewat gateway
        run: |
          $ErrorActionPreference = 'Continue'
          $urls = @('auth', 'setoran', 'reward', 'laporan' | ForEach-Object { "http://localhost:8080/api/$_/health" })
          $urls += 'http://localhost:8080/'
          foreach ($u in $urls) {
            $ok = $false
            for ($i = 1; $i -le 30; $i++) {
              try {
                $r = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 3
            }
            if (-not $ok) {
              Write-Host "::error::$u tidak merespons 200"
              docker compose -p banksampah ps
              docker compose -p banksampah logs --tail 50
              exit 1
            }
            Write-Host "OK  $u"
          }
          exit 0